apiVersion: v1
items:
- apiVersion: ocs.openshift.io/v1
  kind: StorageCluster
  metadata:
    annotations:
      uninstall.ocs.openshift.io/cleanup-policy: delete
      uninstall.ocs.openshift.io/mode: graceful
    finalizers:
    - storagecluster.ocs.openshift.io
    name: ocs-storagecluster
    namespace: openshift-storage
  spec:
    enableCephTools: true
    arbiter: {}
    encryption:
      keyRotation:
        schedule: '@weekly'
      kms: {}
    externalStorage: {}
    managedResources:
      cephBlockPools:
        defaultStorageClass: true
      cephCluster: {}
      cephConfig: {}
      cephDashboard: {}
      cephFilesystems: {}
      cephNonResilientPools: {}
      cephObjectStoreUsers: {}
      cephObjectStores: {}
      cephRBDMirror: {}
      cephToolbox: {}
    network:
      connections:
        encryption: {}
      multiClusterService: {}
    nodeTopologies: {}
    resourceProfile: balanced
    storageDeviceSets:
    - config: {}
      count: 1
      dataPVCTemplate:
        metadata: {}
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 2Ti
          storageClassName: gp3-csi
          volumeMode: Block
        status: {}
      name: ocs-deviceset-gp3-csi
      placement: {}
      portable: true
      preparePlacement: {}
      replica: 3
      resources: {}
